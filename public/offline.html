<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04101B" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Connection paused — TGPI</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; overflow: hidden; background: radial-gradient(circle at 50% 0%, #143556 0, #071525 42%, #030a12 100%); color: #fff; }
      main { width: min(100%, 520px); border: 1px solid rgba(229,185,75,.28); border-radius: 28px; padding: clamp(28px, 7vw, 48px); text-align: center; background: rgba(6,21,37,.88); box-shadow: 0 32px 100px rgba(0,0,0,.42); }
      img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 18px 46px rgba(0,0,0,.28); }
      .eyebrow { margin: 24px 0 0; color: #e5b94b; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 12px 0 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 9vw, 52px); line-height: 1; letter-spacing: -.03em; }
      .description { margin: 20px auto 0; max-width: 390px; color: #b8c4d0; font-size: 16px; line-height: 1.75; }
      .privacy { margin: 18px auto 0; color: #7f91a4; font-size: 12px; line-height: 1.6; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
      a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; border-radius: 13px; padding: 0 20px; color: #07182d; background: #e5b94b; font-size: 14px; font-weight: 800; text-decoration: none; }
      a.secondary { border: 1px solid rgba(255,255,255,.14); color: #fff; background: rgba(255,255,255,.04); }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="TGPI crest" width="104" height="104" />
      <p class="eyebrow">Connection paused</p>
      <h1>Your global plan is protected.</h1>
      <p class="description">Reconnect to continue your Workspace, comparisons, documents and learning progress.</p>
      <p class="privacy">TGPI does not store private workspace pages for offline access.</p>
      <div class="actions">
        <a href="/profile">Try Workspace again</a>
        <a class="secondary" href="/">Open TGPI home</a>
      </div>
    </main>
  </body>
</html>
