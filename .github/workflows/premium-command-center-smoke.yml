name: Premium Command Center smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment URL to verify
        required: true
        default: https://www.theglobalpolymath.com
        type: string
  deployment_status:

permissions:
  contents: read

jobs:
  verify-premium:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (startsWith(github.event.deployment.environment, 'Production') ||
      startsWith(github.event.deployment.environment, 'production')))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve deployment URL
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_URL: ${{ inputs.base_url }}
          PRODUCTION_URL: https://www.theglobalpolymath.com
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target_url="$MANUAL_URL"
          else
            target_url="$PRODUCTION_URL"
          fi

          if [[ -z "$target_url" ]]; then
            echo "No deployment URL was provided." >&2
            exit 1
          fi

          echo "base_url=$target_url" >> "$GITHUB_OUTPUT"

      - name: Verify Premium Command Center
        run: node scripts/verify-premium-command-center.mjs "${{ steps.target.outputs.base_url }}"
