name: Premium Command Center smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment URL to verify
        required: true
        default: https://www.theglobalpolymath.com
        type: string
  deployment_status:

permissions:
  contents: read

jobs:
  verify-premium:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (startsWith(github.event.deployment.environment, 'Production') ||
      startsWith(github.event.deployment.environment, 'production')))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Verify Premium Command Center
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_URL: ${{ inputs.base_url }}
          PRODUCTION_URL: https://www.theglobalpolymath.com
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$MANUAL_URL" ]]; then
              echo "No deployment URL was provided." >&2
              exit 1
            fi
            node scripts/verify-premium-command-center.mjs "$MANUAL_URL"
          else
            node scripts/verify-premium-command-center.mjs "$PRODUCTION_URL"
          fi
