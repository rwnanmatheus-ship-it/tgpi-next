name: SEO health
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
  deployment_status:
permissions:
  contents: read
concurrency:
  group: seo-health
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      (startsWith(github.event.deployment.environment, 'Production') ||
      startsWith(github.event.deployment.environment, 'production')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test SEO checks
        run: node --test scripts/seo.test.mjs
      - name: Audit public production pages
        run: node scripts/seo-audit.mjs
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seo-audit
          path: seo-audit-report.json
          retention-days: 30
