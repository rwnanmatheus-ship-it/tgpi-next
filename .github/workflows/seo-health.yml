name: SEO health
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
  deployment_status:
permissions:
  contents: read
concurrency:
  group: seo-health
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      (startsWith(github.event.deployment.environment, 'Production') ||
      startsWith(github.event.deployment.environment, 'production')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Test SEO checks
        run: node --experimental-strip-types --test scripts/seo.test.mjs scripts/seo-discovery.test.mjs
      - name: Audit public production pages
        run: node scripts/seo-audit.mjs
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seo-audit
          path: seo-audit-report.json
          retention-days: 30
