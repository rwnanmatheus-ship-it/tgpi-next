name: Dossier source review signals
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
  deployment_status:
permissions:
  contents: read
concurrency:
  group: dossier-source-watch
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && (startsWith(github.event.deployment.environment, 'Production') || startsWith(github.event.deployment.environment, 'production')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix-deploy-hoje
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evidence-history/previous.json
          key: dossier-sources-v2-${{ github.run_id }}
          restore-keys: dossier-sources-v2-
      - name: Inspect public sources and compare available fingerprints
        run: node --experimental-strip-types scripts/watch-dossier-sources.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dossier-source-report-${{ github.run_id }}
          path: dossier-source-report.json
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: evidence-history/previous.json
          key: dossier-sources-v2-${{ github.run_id }}
