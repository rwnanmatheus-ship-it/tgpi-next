name: Dossier source review signals
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
  deployment_status:
permissions:
  contents: read
concurrency:
  group: dossier-source-watch
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && (startsWith(github.event.deployment.environment, 'Production') || startsWith(github.event.deployment.environment, 'production')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix-deploy-hoje
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: evidence-history/previous.json
          key: dossier-sources-v2-${{ github.run_id }}
          restore-keys: dossier-sources-v2-
      - name: Inspect public sources and compare available fingerprints
        run: node --experimental-strip-types scripts/watch-dossier-sources.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dossier-source-report-${{ github.run_id }}
          path: dossier-source-report.json
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always()
        with:
          path: evidence-history/previous.json
          key: dossier-sources-v2-${{ github.run_id }}
